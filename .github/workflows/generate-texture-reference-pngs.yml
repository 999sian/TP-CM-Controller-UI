name: Generate texture reference PNGs

on:
  push:
    branches: ["texture-reference-pngs"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate PNG references
        run: python tools/export_texture_reference_pngs.py --write

      - name: Commit generated PNGs
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- extras/texture-bases)" ]]; then
            echo "Texture reference PNGs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras/texture-bases
          git commit -m "Generate BTI texture reference PNGs"
          git push
